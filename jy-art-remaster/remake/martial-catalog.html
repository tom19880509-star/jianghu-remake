<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>江湖武典 · 武学对照</title><link rel="icon" href="data:,"><link rel="stylesheet" href="martial-catalog.css?v=157"></head><body>
<header><div><small>江湖重绘 · 本地数值初版</small><h1>江湖武典 <span>知其来处，察其长短</span></h1></div><button id="back">返回江湖</button></header>
<main><aside><label class="search">查武学<input id="search" type="search" placeholder="武学、别名，如九阳、玉女" autocomplete="off"></label><div class="filters"><select id="kind" aria-label="武学类别"><option value="">全部门类</option><option value="fist">拳掌指爪</option><option value="sword">剑法</option><option value="blade">刀法</option><option value="special">奇门兵器</option><option value="internal">内功</option><option value="lightness">轻功</option><option value="support">其他法门</option></select><select id="state" aria-label="接入状态"><option value="">全部候选</option><option value="native">已有游戏身份</option><option value="candidate">扩展候选</option><option value="novel">有原著核对依据</option></select></div><p id="count" role="status"></p><p class="grade-legend">名色：<b class="grade-name" data-grade="juexue">绝学</b>·<b class="grade-name" data-grade="shangcheng">上乘</b>·<b class="grade-name" data-grade="mingjia">名家</b>·<b class="grade-name" data-grade="xunchang">寻常</b>；未曾见过或来源待核的一律灰字，不示朱批。</p><div id="list" role="list"></div></aside>
<section class="reading"><div id="detail"></div><section class="comparison"><h2>同样投入，练到何种境界</h2><p>选择最多三门作对照。模拟只比较修炼投入与招式数值，不替代战棋实测；不计算剧情赠功、装备代用、武学根基、暴击及旁通。实战中对应根基每点增加0.2%招式威力，上限20%；刀剑代用降低30%招式威力，最终伤害还受攻防、站位和招式影响。</p><div class="inputs"><label>资质 <input id="apt" type="range" min="0" max="100" value="50"><output id="apt-value">50</output></label><label>可用心得 <input id="budget" type="number" min="0" max="100000" step="100" value="5000"></label></div><div id="comparison"></div></section></section></main>
<footer>目录收录不等于当前主线全部可学。MOD 名称不代表原著认证；所有数值均为本作平衡设计。未完成的专属机制不会用介绍文字冒充已经生效。</footer><script type="module" src="martial-catalog.js?v=157"></script></body></html>
